# 토큰 연장 — 인스타 장기 토큰은 60일이면 죽는다.
#
# 죽으면 게시가 조용히 멈추고, 보통 며칠 지나서야 알아차린다.
# 그래서 매주 한 번 미리 연장한다. 연장은 만료 전이면 언제든 되고,
# 할 때마다 다시 60일이 된다.
#
# ⚠ 서버는 자기 시크릿을 스스로 못 바꾼다.
#    그래서 이 워크플로는 "새 토큰"을 로그에 남기고 끝난다.
#    로그의 토큰을 Settings → Secrets → Actions → IG_TOKEN 에 붙여넣어야
#    실제로 연장이 반영된다. 아래 알림 단계가 만료가 가까우면 크게 경고한다.
name: 토큰 연장

on:
  schedule:
    - cron: '0 1 * * 1'       # 매주 월요일 한국시간 오전 10시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 토큰 연장
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "::error::IG_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          node scripts/ig.js refresh

      - name: 만료일 기록 커밋
        run: |
          git config user.name  "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "토큰 만료일 갱신"
            git push
          fi

      - name: 만료가 가까우면 크게 알린다
        run: |
          until=$(node -e "console.log(require('./state.json').token_expires_around||'')")
          if [ -z "$until" ]; then exit 0; fi
          left=$(( ( $(date -d "$until" +%s) - $(date +%s) ) / 86400 ))
          echo "토큰 만료까지 ${left}일 (${until})"
          if [ "$left" -lt 14 ]; then
            echo "::error::토큰 만료까지 ${left}일 남았습니다. 위 로그의 새 토큰을 IG_TOKEN 시크릿에 넣으십시오."
          fi
