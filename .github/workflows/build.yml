# 카드 만들기 — 매일 아침 한 번, 하루치 6개를 통째로 만든다.
#
# ── 시각을 아침 9시(한국)로 잡은 이유 ────────────────────────────
# 이 파이프라인은 "어제 경기 결과"를 받는다. 그런데 데이터 제공처는 UTC 날짜로
# 경기를 묶는다. 한국시간 아침 9시가 정확히 UTC 자정이라, 이 순간이 되어야
# "어제(UTC)" 가 완전히 끝난 상태가 된다.
#
# 더 이르게 잡으면 — 예를 들어 새벽 5시(전날 UTC 20시) — 유럽 밤경기가 아직
# 진행 중이라 결과가 비거나 반쪽만 온다. 하루 종일 그 반쪽으로 게시하게 된다.
#
# ── 게시와 따로 도는 이유 ────────────────────────────────────
# 카드는 GitHub Pages 에 올라가야 인스타가 가져갈 수 있는데, 커밋 후 실제
# 반영까지 몇 분 걸린다. 만들자마자 올리면 아직 없는 주소를 가지러 갔다 실패한다.
# 그래서 아침에 만들어 두고 첫 게시는 두 시간 뒤부터 시작한다.
name: 카드 만들기

on:
  schedule:
    - cron: '0 0 * * *'       # UTC 자정 = 한국시간 아침 9시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 꾸러미 설치
        run: npm ci --no-audit --no-fund

      - name: 서체 준비
        run: npm run fonts

      # 리그 10개를 훑느라 3분쯤 걸린다 (제공처 요청 한도 때문에 쉬어 간다)
      - name: 데이터 받아 카드·캡션·큐 만들기
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: node scripts/build.js

      - name: 만든 것 커밋 (이때 Pages 에 카드가 올라간다)
        run: |
          git config user.name  "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs queue state.json
          if git diff --cached --quiet; then
            echo "만들 것이 없었습니다 — 커밋 생략"
          else
            git commit -m "카드 준비: $(TZ=Asia/Seoul date +%F)"
            git push
          fi
