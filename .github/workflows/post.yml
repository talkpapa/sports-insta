# 게시 — 하루 3번, 아침에 만들어 둔 릴스를 하나씩 올린다.
#
# ── 한 번에 하나만 올리는 이유 ────────────────────────────────
# 세 편을 한꺼번에 쏟으면 서로의 도달을 깎아먹고, 새 계정이 그러면 스팸으로
# 읽혀 노출이 눌린다. 시각을 나눠 하나씩 내보낸다.
#
# ── 시각 (한국시간 → UTC 는 9시간 뺀 값) ──────────────────────
#   12:30 점심   18:30 퇴근길   21:30 밤
# 첫 게시가 12시 반인 것은 릴스 만들기(아침 9시) 뒤 Pages 반영을 기다리기 위함이다.
#
# ── 하루 6편으로 올리실 때 ───────────────────────────────────
# ① config.json 의 publish.perDay 를 6 으로
# ② 아래 주석 처리된 cron 세 줄의 '# ' 를 지우면 끝이다.
# 반대로 줄이실 때는 perDay 만 낮추면 된다 — 남는 시각은 알아서 넘어간다.
#
# ── 밀리면 어떻게 되나 ───────────────────────────────────────
# 슬롯은 파일 하나씩이고, 나간 것만 _done 으로 옮겨진다. 한 번 실패해도
# 다음 시각에 그 슬롯이 이어서 나간다. 그날 몫을 다 채우면 스스로 멈춘다.
name: 게시

on:
  schedule:
    - cron: '30 3 * * *'      # 한국시간 12:30
    - cron: '30 9 * * *'      # 한국시간 18:30
    - cron: '30 12 * * *'     # 한국시간 21:30
    # 하루 6편으로 올리실 때 아래 세 줄의 '# ' 를 지우십시오
    # - cron: '0 2 * * *'     # 한국시간 11:00
    # - cron: '0 7 * * *'     # 한국시간 16:00
    # - cron: '0 14 * * *'    # 한국시간 23:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 꾸러미 설치
        run: npm ci --no-audit --no-fund

      # 사람이 안 보고 나가는 게시물이다. 여기서 한 번이라도 걸리면 올리지 않는다.
      # 종료코드 3 = 지금 올릴 것이 없음(정상). 1 = 뭔가 이상함(게시 금지).
      - name: 게시 전 검사
        id: verify
        run: |
          set +e
          node scripts/verify.js
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "3" ]; then echo "지금 올릴 것이 없습니다 — 정상 종료"; exit 0; fi
          if [ "$code" != "0" ]; then echo "::warning::검사에서 걸려 이번 편을 건너뜁니다"; exit 0; fi

      - name: 릴스 게시
        if: steps.verify.outputs.code == '0'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "::error::IG_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          node scripts/ig.js queue

      - name: 게시 이력 커밋
        if: steps.verify.outputs.code == '0'
        run: |
          git config user.name  "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json queue
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "게시: $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash || true
            git push
          fi
